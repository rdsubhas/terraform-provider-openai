name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release tag to create, for example v3.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version such as v3.0.0"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

  release:
    needs: bump_version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
